name: live_pose_detector
description: Real-time human pose detection with skeleton overlay for Flutter, plus a built-in push-up form checker and rep counter. Drop-in camera + ML Kit pose landmarks.
version: 0.0.5
repository: https://github.com/Androidsignal/live_pose_detector
issue_tracker: https://github.com/Androidsignal/live_pose_detector/issues
topics:
  - pose-detection
  - ml-kit
  - camera
  - fitness
  - computer-vision

# pub.dev shows the first screenshot as the package thumbnail.
screenshots:
  - description: Live pose skeleton on push-ups, squats, lateral raises, jumping jacks and lunges.
    path: screenshots/overview.webp
  - description: Live skeleton overlay with push-up form feedback and rep counter.
    path: screenshots/pushup.webp
  - description: Pose skeleton tracking a squat.
    path: screenshots/squats.webp
  - description: Pose skeleton tracking a lateral raise.
    path: screenshots/lateral_raises.webp
  - description: Pose skeleton tracking a jumping jack.
    path: screenshots/jumping_jack.webp
  - description: Pose skeleton tracking a lunge.
    path: screenshots/lunges.webp

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  camera: '>=0.10.5 <0.13.0'
  google_mlkit_pose_detection: '>=0.11.0 <0.17.0'
  permission_handler: '>=10.4.0 <14.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
